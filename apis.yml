name: AInnovation
description: 'AInnovation (创新奇智, Qingdao AInnovation Technology Group) is a Chinese enterprise
  artificial-intelligence company founded in 2018 and listed on the Hong Kong Stock Exchange
  (02121.HK). It focuses on "AI + Manufacturing", delivering industrial AI through its AInnoGC
  platform — an industrial large-language-model and AI-agent application-development platform —
  and its MMOC technology stack: ManuVision machine-vision, MatrixVision edge-video intelligence,
  and the Orion distributed machine-learning platform. It serves manufacturing verticals including
  semiconductors, steel, 3C electronics, automotive, energy, food and materials, construction, and
  financial services. Backed by SoftBank Vision Fund, the company reports 1,400+ patent applications.
  No public developer API, SDK, or developer portal is published as of this profile.'
